<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<!-- INLINE_CSS -->
</head>
<body class="m-0 p-2 font-sans text-xs text-neutral-900 bg-white">
  <div class="flex gap-1.5 mb-1">
    <button
      data-action="choose-file-folder"
      class="shrink-0 h-8 w-8 flex items-center justify-center rounded-md border border-neutral-300 bg-white hover:bg-neutral-50 cursor-pointer text-neutral-600"
      title="Select tokens folder"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
    </button>
    <div class="relative flex-1 min-w-0">
      <select
        id="collection-select"
        class="appearance-none w-full h-8 text-[11px] border border-neutral-300 rounded-md pl-3 pr-7 bg-white cursor-pointer"
      >
        <option value="ALL">All Collections</option>
      </select>
      <svg
        class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-neutral-500"
        width="10"
        height="10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <button
      data-action="export"
      class="shrink-0 h-8 px-3 flex items-center justify-center gap-1 text-[11px] rounded-md border border-neutral-300 bg-white hover:bg-neutral-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer"
    >
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 9-6-6-6 6"/><path d="M12 3v14"/><path d="M5 21h14"/></svg>
      Export
    </button>
    <button
      data-action="import"
      class="shrink-0 h-8 px-3 flex items-center justify-center gap-1 text-[11px] rounded-md border border-neutral-300 bg-white hover:bg-neutral-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer"
    >
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>
      Import
    </button>
  </div>

  <div id="file-status" class="text-[11px] text-neutral-500 mb-1"></div>

  <div id="log" class="text-[11px] text-neutral-700 whitespace-pre-wrap bg-neutral-50 rounded-md p-2"></div>

  <div id="confirm-overlay" class="fixed inset-0 bg-black/40 items-center justify-center p-4" style="display: none;">
    <div class="relative bg-white rounded-md shadow-lg p-3 w-full max-w-[280px]">
      <button
        id="confirm-close"
        class="absolute top-1.5 right-1.5 text-neutral-400 hover:text-neutral-600 cursor-pointer"
        title="Cancel"
      >
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <div id="confirm-text" class="text-[11px] text-neutral-800 mb-2 pr-4"></div>
      <div id="confirm-list" class="text-[11px] text-neutral-500 max-h-24 overflow-y-auto mb-2 whitespace-pre-wrap"></div>
      <div class="flex gap-1.5 justify-end">
        <button id="confirm-cancel" class="h-7 px-3 text-[11px] rounded-md border border-neutral-300 bg-white hover:bg-neutral-50 cursor-pointer">Cancel</button>
        <button id="confirm-continue" class="h-7 px-3 text-[11px] rounded-md bg-red-600 text-white hover:bg-red-700 cursor-pointer">Continue</button>
      </div>
    </div>
  </div>

  <svg
    id="resize-handle"
    class="fixed bottom-0.5 right-0.5 text-neutral-400 hover:text-neutral-600"
    style="cursor: nwse-resize;"
    width="10"
    height="10"
    viewBox="0 0 10 10"
    fill="none"
  >
    <path d="M9 3L3 9" stroke="currentColor" stroke-width="1"/>
    <path d="M9 6.5L6.5 9" stroke="currentColor" stroke-width="1"/>
  </svg>

  <script>
    const BRIDGE = "http://localhost:8934";
    const state = {
      collections: [],
      folder: null,
      selectedCollectionId: "ALL",
    };

    const ICONS = {
      success:
        '<svg width="12" height="12" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
        '<circle cx="12" cy="12" r="10" fill="#16a34a"/>' +
        '<path d="M8 12.5l2.5 2.5L16 9.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' +
        "</svg>",
      error:
        '<svg width="12" height="12" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
        '<circle cx="12" cy="12" r="10" fill="#dc2626"/>' +
        '<path d="M9 9l6 6M15 9l-6 6" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>' +
        "</svg>",
      info:
        '<svg width="12" height="12" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
        '<circle cx="12" cy="12" r="10" fill="#a3a3a3"/>' +
        '<circle cx="12" cy="8" r="1.2" fill="white"/>' +
        '<path d="M12 11v5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>' +
        "</svg>",
    };
    const TITLE_COLOR = { success: "text-green-600", error: "text-red-600", info: "text-neutral-700" };

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function log(title, detail, kind) {
      kind = kind || "info";
      const icon = ICONS[kind];
      const detailHtml = detail
        ? '<div class="text-neutral-600 mt-0.5">' + escapeHtml(detail) + "</div>"
        : "";
      document.getElementById("log").innerHTML =
        '<div class="flex items-start gap-1.5">' +
          '<span class="mt-0.5 shrink-0">' + icon + "</span>" +
          '<span class="min-w-0 flex-1"><span class="font-semibold ' + TITLE_COLOR[kind] + '">' + escapeHtml(title) + "</span>" +
            detailHtml +
          "</span>" +
        "</div>";
    }

    function slug(name) {
      return name.toLowerCase();
    }

    function selectedCollection() {
      return state.collections.find((c) => c.id === state.selectedCollectionId) || null;
    }

    function collectionDir(c) {
      return state.folder + "/" + slug(c.name);
    }

    function render() {
      const folderBtn = document.querySelector('[data-action="choose-file-folder"]');
      folderBtn.title = state.folder || "Select tokens folder";

      const select = document.getElementById("collection-select");
      const currentValue = state.selectedCollectionId;
      select.innerHTML = '<option value="ALL">All Collections</option>';
      for (const c of state.collections) {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.name;
        select.appendChild(opt);
      }
      select.value = currentValue;

      const hasFolder = Boolean(state.folder);
      document.querySelector('[data-action="export"]').disabled = !hasFolder;
      document.querySelector('[data-action="import"]').disabled = !hasFolder;
    }

    async function refreshFileStatus() {
      const el = document.getElementById("file-status");
      const c = selectedCollection();
      if (!state.folder || !c) {
        el.textContent = "";
        return;
      }
      el.textContent = "Checking…";
      try {
        const res = await fetch(BRIDGE + "/list-files?dir=" + encodeURIComponent(collectionDir(c)));
        const data = await res.json();
        const files = data.files || [];
        el.textContent = files.length > 0 ? files.join(", ") : "Files not found";
      } catch (err) {
        el.textContent = "";
      }
    }

    document.getElementById("collection-select").addEventListener("change", (e) => {
      state.selectedCollectionId = e.target.value;
      render();
      refreshFileStatus();
    });

    async function importGroupsFor(collections) {
      const groups = [];
      for (const c of collections) {
        const dir = collectionDir(c);
        const listRes = await fetch(BRIDGE + "/list-files?dir=" + encodeURIComponent(dir));
        const listData = await listRes.json();
        const files = listData.files || [];
        if (files.length === 0) continue;
        const readRes = await fetch(BRIDGE + "/read-files", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ dir: dir, files: files }),
        });
        const readData = await readRes.json();
        groups.push({
          collectionId: c.id,
          files: files.map((filename) => ({ filename, content: readData[filename] })),
        });
      }
      return groups;
    }

    document.addEventListener("click", async (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === "choose-file-folder") {
        log("Opening folder picker…", "", "info");
        try {
          const res = await fetch(BRIDGE + "/choose-folder", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: "Select tokens folder for this Figma file" }),
          });
          const data = await res.json();
          if (!data.path) {
            log("Cancelled", "", "info");
            return;
          }
          parent.postMessage({ pluginMessage: { type: "save-folder", folderPath: data.path } }, "*");
          log("Saved folder", data.path, "success");
          refreshFileStatus();
        } catch (err) {
          log("Bridge server error", err.message + ". Is it running (npm run start)?", "error");
        }
        return;
      }

      if (action === "export") {
        const c = selectedCollection();
        const label = c ? c.name : "all collections";
        log("Exporting", label, "info");
        parent.postMessage(
          { pluginMessage: { type: "export", collectionId: state.selectedCollectionId, dir: state.folder } },
          "*",
        );
        return;
      }

      if (action === "import") {
        const isAll = state.selectedCollectionId === "ALL";
        const targets = isAll ? state.collections : state.collections.filter((c) => c.id === state.selectedCollectionId);
        if (targets.length === 0) return;
        const label = isAll ? "all collections" : targets[0].name;
        log("Checking", label, "info");
        try {
          const groups = await importGroupsFor(targets);
          if (groups.length === 0) {
            log("Nothing to import", "no token files found", "info");
            return;
          }

          parent.postMessage({ pluginMessage: { type: "check-import", groups: groups } }, "*");
          const missing = await waitForCheckResult();

          let deleteMissing = false;
          if (missing.length > 0) {
            const proceed = await showConfirm(missing);
            if (!proceed) {
              log("Import cancelled", "", "info");
              return;
            }
            deleteMissing = true;
          }

          log("Importing", label, "info");
          parent.postMessage(
            { pluginMessage: { type: "import", groups: groups, deleteMissing: deleteMissing } },
            "*",
          );
        } catch (err) {
          log("Import failed", err.message, "error");
        }
        return;
      }
    });

    let pendingCheckResolve = null;

    function waitForCheckResult() {
      return new Promise((resolve) => {
        pendingCheckResolve = resolve;
      });
    }

    function showConfirm(missing) {
      return new Promise((resolve) => {
        const overlay = document.getElementById("confirm-overlay");
        document.getElementById("confirm-text").textContent =
          missing.length + " variable(s) will be deleted. Continue?";
        document.getElementById("confirm-list").textContent = missing.join("\n");
        overlay.style.display = "flex";

        function finish(result) {
          overlay.style.display = "none";
          resolve(result);
        }

        document.getElementById("confirm-cancel").onclick = () => finish(false);
        document.getElementById("confirm-continue").onclick = () => finish(true);
        document.getElementById("confirm-close").onclick = () => finish(false);
      });
    }

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "collections") {
        state.collections = msg.collections;
        state.folder = msg.folder;
        render();
        refreshFileStatus();
        log("Ready", "", "info");
      }

      if (msg.type === "do-export") {
        try {
          const res = await fetch(BRIDGE + "/export", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dir: msg.dir, files: msg.files }),
          });
          const data = await res.json();
          log("Exported", data.written.length + " file(s)", "success");
          refreshFileStatus();
        } catch (err) {
          log("Export failed", err.message, "error");
        }
      }

      if (msg.type === "import-check-result") {
        if (pendingCheckResolve) {
          const resolve = pendingCheckResolve;
          pendingCheckResolve = null;
          resolve(msg.missing || []);
        }
      }

      if (msg.type === "import-result") {
        const s = msg.summary;
        const lines = [];
        lines.push("Created: " + s.created.length);
        for (const n of s.created) lines.push("- " + n);
        lines.push("Deleted: " + s.deleted.length);
        for (const n of s.deleted) lines.push("- " + n);
        if (s.removed && s.removed.length > 0) {
          lines.push("Removed: " + s.removed.length);
          for (const n of s.removed) lines.push("- " + n);
        }
        lines.push("Updated: " + s.updated.length);
        lines.push("- Name: " + s.nameChanges);
        lines.push("- Value: " + s.valueChanges);
        lines.push("- Scope: " + s.scopeChanges);
        lines.push("- Description: " + s.descriptionChanges);
        lines.push("- Code Syntax: " + s.codeSyntaxChanges);
        if (s.notes && s.notes.length > 0) {
          lines.push(...s.notes);
        }
        log("Import done", lines.join("\n"), "success");
      }
    };

    parent.postMessage({ pluginMessage: { type: "get-collections" } }, "*");

    (function () {
      const handle = document.getElementById("resize-handle");
      const MIN_W = 260;
      const MIN_H = 90;
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let startW = 0;
      let startH = 0;

      handle.addEventListener("mousedown", (e) => {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startW = window.innerWidth;
        startH = window.innerHeight;
        e.preventDefault();
      });

      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const width = Math.max(MIN_W, startW + (e.clientX - startX));
        const height = Math.max(MIN_H, startH + (e.clientY - startY));
        parent.postMessage({ pluginMessage: { type: "resize-ui", width: width, height: height } }, "*");
      });

      window.addEventListener("mouseup", () => {
        dragging = false;
      });
    })();
  </script>
</body>
</html>
