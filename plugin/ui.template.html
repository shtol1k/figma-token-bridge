<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<!-- INLINE_CSS -->
</head>
<body class="m-0 p-2 font-sans text-xs text-neutral-900 bg-white">
  <div class="flex items-center gap-1.5 h-8 bg-neutral-50 rounded px-1.5 mb-1.5">
    <button
      data-action="choose-file-folder"
      class="shrink-0 flex items-center cursor-pointer text-neutral-600"
      title="Change tokens folder"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
    </button>
    <div id="folder-display" class="flex-1 min-w-0 truncate text-[11px] text-neutral-600">(not set)</div>
  </div>

  <div class="flex gap-1.5 mb-1.5">
    <div class="relative flex-1 min-w-0">
      <select
        id="collection-select"
        class="appearance-none w-full h-8 text-[11px] border border-neutral-300 rounded-md pl-3 pr-7 bg-white cursor-pointer"
      >
        <option value="ALL">All Collections</option>
      </select>
      <svg
        class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-neutral-500"
        width="10"
        height="10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <button
      data-action="export"
      class="h-8 px-3 flex items-center justify-center gap-1 text-[11px] rounded-md border border-neutral-300 bg-white hover:bg-neutral-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer"
    >
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 9-6-6-6 6"/><path d="M12 3v14"/><path d="M5 21h14"/></svg>
      Export
    </button>
    <button
      data-action="toggle-import"
      class="h-8 px-3 flex items-center justify-center gap-1 text-[11px] rounded-md border border-neutral-300 bg-white hover:bg-neutral-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer"
    >
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>
      Import
    </button>
  </div>

  <div id="import-panel"></div>

  <div id="log" class="text-[11px] text-neutral-700 whitespace-pre-wrap"></div>

  <svg
    id="resize-handle"
    class="fixed bottom-0.5 right-0.5 text-neutral-400 hover:text-neutral-600"
    style="cursor: nwse-resize;"
    width="10"
    height="10"
    viewBox="0 0 10 10"
    fill="none"
  >
    <path d="M9 3L3 9" stroke="currentColor" stroke-width="1"/>
    <path d="M9 6.5L6.5 9" stroke="currentColor" stroke-width="1"/>
  </svg>

  <script>
    const BRIDGE = "http://localhost:8934";
    const state = {
      collections: [],
      folder: null,
      selectedCollectionId: "ALL",
      importOpen: false,
      importFiles: [],
    };

    const ICONS = {
      success:
        '<svg width="12" height="12" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
        '<circle cx="12" cy="12" r="10" fill="#16a34a"/>' +
        '<path d="M8 12.5l2.5 2.5L16 9.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' +
        "</svg>",
      error:
        '<svg width="12" height="12" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
        '<circle cx="12" cy="12" r="10" fill="#dc2626"/>' +
        '<path d="M9 9l6 6M15 9l-6 6" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>' +
        "</svg>",
      info:
        '<svg width="12" height="12" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
        '<circle cx="12" cy="12" r="10" fill="#a3a3a3"/>' +
        '<circle cx="12" cy="8" r="1.2" fill="white"/>' +
        '<path d="M12 11v5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>' +
        "</svg>",
    };
    const TITLE_COLOR = { success: "text-green-600", error: "text-red-600", info: "text-neutral-700" };

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function log(title, detail, kind) {
      kind = kind || "info";
      const icon = ICONS[kind];
      const detailHtml = detail
        ? '<span class="text-neutral-600"> ' + escapeHtml(detail) + "</span>"
        : "";
      document.getElementById("log").innerHTML =
        '<div class="flex items-start gap-1.5">' +
          '<span class="mt-0.5 shrink-0">' + icon + "</span>" +
          '<span><span class="font-semibold ' + TITLE_COLOR[kind] + '">' + escapeHtml(title) + "</span>" +
            detailHtml +
          "</span>" +
        "</div>";
    }

    function slug(name) {
      return name.toLowerCase();
    }

    function selectedCollection() {
      return state.collections.find((c) => c.id === state.selectedCollectionId) || null;
    }

    function render() {
      const folderEl = document.getElementById("folder-display");
      folderEl.textContent = state.folder || "(not set)";
      folderEl.title = state.folder || "";

      const select = document.getElementById("collection-select");
      const currentValue = state.selectedCollectionId;
      select.innerHTML = '<option value="ALL">All Collections</option>';
      for (const c of state.collections) {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.name;
        select.appendChild(opt);
      }
      select.value = currentValue;

      const hasFolder = Boolean(state.folder);
      const isAll = state.selectedCollectionId === "ALL";
      document.querySelector('[data-action="export"]').disabled = !hasFolder;
      document.querySelector('[data-action="toggle-import"]').disabled = !hasFolder || isAll;

      const panel = document.getElementById("import-panel");
      if (!state.importOpen || isAll) {
        panel.innerHTML = "";
        return;
      }
      const c = selectedCollection();
      if (!c) {
        panel.innerHTML = "";
        return;
      }
      if (state.importFiles.length === 0) {
        panel.innerHTML =
          '<div class="mb-1.5 p-1.5 bg-neutral-50 rounded-md text-[11px] text-neutral-500">No *.tokens.json files found in ' +
          state.folder + "/" + slug(c.name) + "</div>";
      } else {
        const items = state.importFiles
          .map(
            (f) => '<label class="block text-[11px] py-0.5"><input type="checkbox" value="' + f +
              '" checked class="mr-1.5 align-middle"> ' + f + "</label>",
          )
          .join("");
        panel.innerHTML =
          '<div class="mb-1.5 p-1.5 bg-neutral-50 rounded-md">' +
          items +
          '<button data-action="import-selected" class="text-[11px] px-2 py-1 rounded-md bg-neutral-900 text-white hover:bg-neutral-700 cursor-pointer mt-1">Import selected</button>' +
          "</div>";
      }
    }

    async function openImportPanel() {
      const c = selectedCollection();
      if (!c) return;
      state.importOpen = true;
      state.importFiles = [];
      render();
      try {
        const listDir = state.folder + "/" + slug(c.name);
        const res = await fetch(BRIDGE + "/list-files?dir=" + encodeURIComponent(listDir));
        const data = await res.json();
        state.importFiles = data.files || [];
      } catch (err) {
        log("List files failed", err.message, "error");
      }
      render();
    }

    document.getElementById("collection-select").addEventListener("change", (e) => {
      state.selectedCollectionId = e.target.value;
      state.importOpen = false;
      state.importFiles = [];
      render();
    });

    document.addEventListener("click", async (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === "choose-file-folder") {
        log("Opening folder picker…", "", "info");
        try {
          const res = await fetch(BRIDGE + "/choose-folder", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: "Select tokens folder for this Figma file" }),
          });
          const data = await res.json();
          if (!data.path) {
            log("Cancelled", "", "info");
            return;
          }
          parent.postMessage({ pluginMessage: { type: "save-folder", folderPath: data.path } }, "*");
          log("Saved folder", data.path, "success");
        } catch (err) {
          log("Bridge server error", err.message + ". Is it running (npm run start)?", "error");
        }
        return;
      }

      if (action === "export") {
        const c = selectedCollection();
        const label = c ? c.name : "all collections";
        log("Exporting", label, "info");
        parent.postMessage(
          { pluginMessage: { type: "export", collectionId: state.selectedCollectionId, dir: state.folder } },
          "*",
        );
        return;
      }

      if (action === "toggle-import") {
        if (state.importOpen) {
          state.importOpen = false;
          render();
          return;
        }
        log("Listing files", selectedCollection() ? selectedCollection().name : "", "info");
        await openImportPanel();
        return;
      }

      if (action === "import-selected") {
        const c = selectedCollection();
        if (!c) return;
        const panel = document.getElementById("import-panel");
        const checked = Array.from(panel.querySelectorAll('input[type="checkbox"]:checked')).map(
          (cb) => cb.value,
        );
        if (checked.length === 0) {
          log("Select a file", "at least one file is required to import", "info");
          return;
        }
        log("Reading files", checked.length + " file(s) for " + c.name, "info");
        try {
          const listDir = state.folder + "/" + slug(c.name);
          const res = await fetch(BRIDGE + "/read-files", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dir: listDir, files: checked }),
          });
          const data = await res.json();
          const files = checked.map((filename) => ({ filename, content: data[filename] }));
          log("Importing", c.name, "info");
          parent.postMessage(
            { pluginMessage: { type: "import", collectionId: c.id, files: files } },
            "*",
          );
        } catch (err) {
          log("Read files failed", err.message, "error");
        }
        return;
      }
    });

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "collections") {
        state.collections = msg.collections;
        state.folder = msg.folder;
        render();
        log("Ready", "", "info");
      }

      if (msg.type === "do-export") {
        try {
          const res = await fetch(BRIDGE + "/export", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dir: msg.dir, files: msg.files }),
          });
          const data = await res.json();
          log("Exported", data.written.length + " file(s)", "success");
        } catch (err) {
          log("Export failed", err.message, "error");
        }
      }

      if (msg.type === "import-result") {
        const s = msg.summary;
        let detail =
          "updated: " + s.updated + ", renamed: " + s.renamed +
          ", created: " + s.created + ", stale-ID fallback: " + s.staleId;
        if (s.notes && s.notes.length > 0) {
          detail += "\n" + s.notes.join("\n");
        }
        log("Import done", detail, "success");
        state.importOpen = false;
        render();
      }
    };

    parent.postMessage({ pluginMessage: { type: "get-collections" } }, "*");

    (function () {
      const handle = document.getElementById("resize-handle");
      const MIN_W = 260;
      const MIN_H = 100;
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let startW = 0;
      let startH = 0;

      handle.addEventListener("mousedown", (e) => {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startW = window.innerWidth;
        startH = window.innerHeight;
        e.preventDefault();
      });

      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const width = Math.max(MIN_W, startW + (e.clientX - startX));
        const height = Math.max(MIN_H, startH + (e.clientY - startY));
        parent.postMessage({ pluginMessage: { type: "resize-ui", width: width, height: height } }, "*");
      });

      window.addEventListener("mouseup", () => {
        dragging = false;
      });
    })();
  </script>
</body>
</html>
